spring:
  config:
    activate:
      on-profile: local
  datasource:
    # Java 和 Python 本地服务必须指向同一个文件。
    url: jdbc:sqlite:${AGENT_SQLITE_PATH:../data/agent.sqlite3}
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-local.sql

mybatis:
  mapper-locations: classpath:mapper-local/*.xml

server:
  # local 模式只监听本机回环地址，避免局域网中的其他机器访问本地目录接口。
  address: ${SERVER_ADDRESS:127.0.0.1}

local-directory:
  # 允许根来自维护者配置/环境；用户不能通过请求增加根位置。
  roots:
    - root-id: ${LOCAL_DIRECTORY_ROOT_ID:documents}
      name: ${LOCAL_DIRECTORY_ROOT_NAME:文档}
      path: ${LOCAL_DIRECTORY_DOCUMENTS_PATH:${user.home}/Documents}
  allowed-origins: ${LOCAL_DIRECTORY_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
  trusted-hosts: ${LOCAL_DIRECTORY_TRUSTED_HOSTS:localhost,127.0.0.1,::1}
  # 设置后，所有实际请求都必须带 X-Local-Access-Token；留空时依赖可信 Origin。
  access-token: ${LOCAL_DIRECTORY_ACCESS_TOKEN:}
  # 留空时每次启动随机生成，重启后旧 cursor 自动失效。
  cursor-secret: ${LOCAL_DIRECTORY_CURSOR_SECRET:}
  max-page-size: 200
  max-scan-entries: 10000
  scan-timeout-ms: 2000
